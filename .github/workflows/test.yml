name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm test
  # Mirrors the workflow shown in the CI guide on the site: no browser install, no setup-node.
  # Proves the command works on a stock GitHub runner and that the live site stays clean.
  live-site-check:
    runs-on: ubuntu-latest
    steps:
      - run: npx --yes github:zekemit/fix-list scan https://fix-list.vercel.app/ https://fix-list.vercel.app/check --fail-on minor
